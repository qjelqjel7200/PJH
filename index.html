        // 15 Kids (Wang Im-seung removed)
        const PHOTO_DEFAULTS = [
            { name: '배시우', animalId: 'chick' },
            { name: '최하온', animalId: 'tiger' },
            { name: '조민건', animalId: 'rabbit' },
            { name: '조민서', animalId: 'cat' },
            { name: '진도윤', animalId: 'hamster' },
            { name: '정다온', animalId: 'fox' },
            { name: '박시은', animalId: 'cat' },
            { name: '서은유', animalId: 'cat' },
            { name: '김범', animalId: 'dog' },
            { name: '이지아', animalId: 'rabbit' },
            { name: '김시우', animalId: 'lion' },
            { name: '이유원', animalId: 'elephant' },
            { name: '김택한', animalId: 'frog' },
            { name: '강동우', animalId: 'frog' },
            { name: '김승현', animalId: 'unicorn' }
        ];

        let kidsData = [];
        let activeMode = 'setup'; 
        let timerDuration = 600; 
        let timerRemaining = 600;
        let timerInterval = null;
        let isTimerRunning = false;
        let audioContext = null;

        // BGM State
        let isBgmEnabled = true;
        let bgmIntervalId = null;
        let bgmNoteIndex = 0;

        // Celebrate fountain interval handles
        let burstIntervalId = null;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // Mechanical Timer End Sound (Ding-Dong)
        function playDingDongSound() {
            initAudio();
            const now = audioContext.currentTime;
            const osc1 = audioContext.createOscillator();
            const gain1 = audioContext.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(783.99, now);
            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
            osc1.connect(gain1); gain1.connect(audioContext.destination);
            osc1.start(now); osc1.stop(now + 1.2);
        }

        // Standard card tap sound
        function playPopSound() {
            initAudio();
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.connect(gain); gain.connect(audioContext.destination);
            osc.start(now); osc.stop(now + 0.1);
        }

        // Single child complete chime
        function playSuccessSound() {
            initAudio();
            const now = audioContext.currentTime;
            const frequencies = [1046.50, 1318.51];
            frequencies.forEach((freq, i) => {
                const o = audioContext.createOscillator();
                const g = audioContext.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(freq, now + i * 0.08);
                g.gain.setValueAtTime(0, now);
                g.gain.setValueAtTime(0.15, now + i * 0.08);
                g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
                o.connect(g); g.connect(audioContext.destination);
                o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.3);
            });
        }

        // Highly Optimized Standard Hand Clap Synthesis ("짝!")
        function playSingleClap(time) {
            const bufferSize = audioContext.sampleRate * 0.08; 
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioContext.createBufferSource();
            noise.buffer = buffer;

            const filter = audioContext.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1100, time); 
            filter.Q.setValueAtTime(3.0, time);

            const noiseGain = audioContext.createGain();
            noiseGain.gain.setValueAtTime(0.45, time);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.07);

            const slapBody = audioContext.createOscillator();
            const slapGain = audioContext.createGain();
            slapBody.type = 'triangle';
            slapBody.frequency.setValueAtTime(170, time);
            slapBody.frequency.exponentialRampToValueAtTime(75, time + 0.03);
            
            slapGain.gain.setValueAtTime(0.2, time);
            slapGain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);

            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioContext.destination);

            slapBody.connect(slapGain);
            slapGain.connect(audioContext.destination);

            noise.start(time);
            noise.stop(time + 0.08);
            slapBody.start(time);
            slapBody.stop(time + 0.04);
        }

        // Steady Rhythmic "Clap! Clap! Clap! Clap!" for EXACTLY 10.0 Seconds
        function playLongApplauseSound() {
            initAudio();
            const now = audioContext.currentTime;
            const totalDuration = 10.0; 
            const clapInterval = 0.38; 

            for (let t = 0; t < totalDuration; t += clapInterval) {
                const swing = (Math.random() - 0.5) * 0.024;
                playSingleClap(now + t + swing);
            }
        }

        // Beautiful Harp Arpeggio for All-Completed Celebration
        function playMagicHarpSound() {
            initAudio();
            const now = audioContext.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00, 2637.02]; 
            notes.forEach((freq, i) => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + i * 0.06);
                gain.gain.setValueAtTime(0, now);
                gain.gain.setValueAtTime(0.15, now + i * 0.06);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.7);
                osc.connect(gain); gain.connect(audioContext.destination);
                osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.7);
            });
        }

        // Procedural BGM Synthesizer for Children (Happy and Friendly Kindergarten Tune)
        const BGM_MELODY = [
            { note: 523.25, type: 'sine', duration: 0.25 }, 
            { note: 659.25, type: 'triangle', duration: 0.25 }, 
            { note: 783.99, type: 'sine', duration: 0.25 }, 
            { note: 659.25, type: 'triangle', duration: 0.25 }, 
            
            { note: 587.33, type: 'sine', duration: 0.25 }, 
            { note: 739.99, type: 'triangle', duration: 0.25 }, 
            { note: 880.00, type: 'sine', duration: 0.25 }, 
            { note: 739.99, type: 'triangle', duration: 0.25 }, 

            { note: 440.00, type: 'sine', duration: 0.25 }, 
            { note: 523.25, type: 'triangle', duration: 0.25 }, 
            { note: 659.25, type: 'sine', duration: 0.25 }, 
            { note: 523.25, type: 'triangle', duration: 0.25 }, 

            { note: 698.46, type: 'sine', duration: 0.25 }, 
            { note: 880.00, type: 'triangle', duration: 0.25 }, 
            { note: 1046.50, type: 'sine', duration: 0.25 }, 
            { note: 880.00, type: 'triangle', duration: 0.25 }  
        ];

        function playNextBgmNote() {
            if (!isTimerRunning || !isBgmEnabled) return;
            initAudio();

            const now = audioContext.currentTime;
            const currentItem = BGM_MELODY[bgmNoteIndex];

            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            osc.type = currentItem.type;
            osc.frequency.setValueAtTime(currentItem.note, now);

            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.04, now + 0.05); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + currentItem.duration - 0.02); 

            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);

            osc.start(now);
            osc.stop(now + currentItem.duration);

            bgmNoteIndex = (bgmNoteIndex + 1) % BGM_MELODY.length;
        }

        function startBgmSystem() {
            if (bgmIntervalId) return;
            bgmIntervalId = setInterval(playNextBgmNote, 250);
        }

        function stopBgmSystem() {
            if (bgmIntervalId) {
                clearInterval(bgmIntervalId);
                bgmIntervalId = null;
            }
        }

        function toggleBgmSetting() {
            isBgmEnabled = !isBgmEnabled;
            const bgmBtn = document.getElementById('bgm-toggle-btn');
            const bgmIcon = document.getElementById('bgm-icon');
            const bgmText = document.getElementById('bgm-text');

            if (isBgmEnabled) {
                bgmBtn.className = "z-20 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold px-2 py-0.5 rounded-full text-[10px] md:text-xs flex items-center gap-1 shadow-sm transition-all active:scale-95";
                bgmIcon.className = "fa-solid fa-music text-[9px] md:text-[10px]";
                bgmText.textContent = "음악 켜짐";
                initAudio();
            } else {
                bgmBtn.className = "z-20 bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold px-2 py-0.5 rounded-full text-[10px] md:text-xs flex items-center gap-1 shadow-sm transition-all active:scale-95";
                bgmIcon.className = "fa-solid fa-volume-xmark text-[9px] md:text-[10px]";
                bgmText.textContent = "음악 끔";
            }
        }

        function initFixedData() {
            kidsData = PHOTO_DEFAULTS.map((p, idx) => {
                const dbAnimal = ANIMALS_DATABASE.find(a => a.id === p.animalId) || ANIMALS_DATABASE[0];
                return { id: idx, name: p.name, animal: dbAnimal, completed: false };
            });
        }

        function quickSetTime(min, sec) {
            document.getElementById('input-min').value = min;
            document.getElementById('input-sec').value = sec;
            updateTimerFromInputs();
        }

        function updateTimerFromInputs() {
            const min = parseInt(document.getElementById('input-min').value) || 0;
            const sec = parseInt(document.getElementById('input-sec').value) || 0;
            timerDuration = (min * 60) + sec;
            timerRemaining = timerDuration;
            updateDisplay();
        }

        function updateDisplay() {
            const minutes = Math.floor(timerRemaining / 60);
            const seconds = timerRemaining % 60;
            document.getElementById('display-time').textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            const circle = document.getElementById('timer-progress');
            const circumference = 534.1; 
            const ratio = timerDuration > 0 ? (timerRemaining / timerDuration) : 0;
            if (circle) circle.style.strokeDashoffset = circumference - (ratio * circumference);

            const completedCount = kidsData.filter(k => k.completed).length;
            document.getElementById('completed-count').textContent = completedCount;
        }

        function renderKidsGrid() {
            const rows = [document.getElementById('grid-row-1'), document.getElementById('grid-row-2'), document.getElementById('grid-row-3')];
            if (!rows[0]) return;
            rows.forEach(r => r.innerHTML = '');

            kidsData.forEach((kid, idx) => {
                const card = document.createElement('div');
                card.id = `kid-card-${idx}`;
                const completedBg = kid.completed ? 'bg-gradient-to-br from-rose-50 to-amber-50 border-rose-400 scale-[0.98]' : 'bg-white border-slate-200';
                card.className = `character-card relative h-full flex flex-col items-center justify-between p-1.5 md:p-2.5 rounded-2xl border-2 md:border-3 transition-all duration-200 cursor-pointer overflow-hidden ${completedBg}`;
                card.onclick = (e) => handleCardClick(idx, e);

                card.innerHTML = `
                    <div class="relative w-12 h-12 sm:w-14 sm:h-14 md:w-18 md:h-18 lg:w-22 lg:h-22 flex items-center justify-center rounded-2xl ${kid.animal.color} shadow-sm flex-shrink-0">
                        <span class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl select-none">${kid.animal.emoji}</span>
                        <div class="absolute -top-1 -right-1 bg-rose-500 text-white w-5 h-5 sm:w-6 sm:h-6 rounded-full flex items-center justify-center shadow-md border border-white transform transition-all duration-300 ${kid.completed ? 'scale-100 opacity-100' : 'scale-0 opacity-0'}">
                            <i class="fa-solid fa-heart text-[8px] sm:text-[10px]"></i>
                        </div>
                        <div class="absolute -bottom-1 -left-1 bg-emerald-500 text-white px-1 py-0.5 rounded-lg text-[7px] sm:text-[9px] font-black border border-white transform transition-all duration-300 ${kid.completed ? 'scale-100 opacity-100' : 'scale-0 opacity-0'}">완료!</div>
                    </div>
                    <div class="w-full text-center mt-1 flex-shrink-0">
                        <div class="text-xs sm:text-sm md:text-base lg:text-lg rounded-xl py-1 px-1 tracking-wider font-black text-slate-950 border-yellow-400 bg-yellow-100 ring-2 ring-yellow-300 truncate">
                            ${kid.name}
                        </div>
                    </div>
                `;
                if (idx < 5) rows[0].appendChild(card);
                else if (idx < 10) rows[1].appendChild(card);
                else rows[2].appendChild(card);
            });
        }

        function handleCardClick(index, event) {
            initAudio(); 
            if (activeMode === 'setup') return;

            const kid = kidsData[index];
            kid.completed = !kid.completed;
            
            const totalCompleted = kidsData.filter(k => k.completed).length;

            if (kid.completed && totalCompleted === 15) {
                stopBgmSystem(); 
                playMagicHarpSound();
                playLongApplauseSound(); 
                startTenSecondHeartFountain(); 
            } else {
                if (kid.completed) {
                    playSuccessSound();
                    createSingleFloatingHeart(event);
                } else {
                    playPopSound();
                }
            }

            renderKidsGrid();
            updateDisplay();
        }

        function createSingleFloatingHeart(e) {
            const particle = document.createElement('div');
            particle.className = 'floating-heart text-xl z-50 select-none';
            particle.innerHTML = '❤️';
            particle.style.left = `${e.clientX}px`;
            particle.style.top = `${e.clientY}px`;
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 1200);
        }

        function startTenSecondHeartFountain() {
            if (burstIntervalId) {
                clearInterval(burstIntervalId);
            }
            spawnFountainWave();

            let wavesRun = 0;
            burstIntervalId = setInterval(() => {
                spawnFountainWave();
                wavesRun++;
                if (wavesRun >= 20) {
                    clearInterval(burstIntervalId);
                    burstIntervalId = null;
                }
            }, 500);
        }

        function spawnFountainWave() {
            const container = document.body;
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            const heartTypes = ['❤️', '💖', '💝', '💕', '💗'];

            const epicenters = [
                { x: screenWidth * 0.5, y: screenHeight * 0.5 },
                { x: screenWidth * 0.12, y: screenHeight * 0.25 },
                { x: screenWidth * 0.88, y: screenHeight * 0.25 },
                { x: screenWidth * 0.12, y: screenHeight * 0.75 },
                { x: screenWidth * 0.88, y: screenHeight * 0.75 },
                { x: screenWidth * 0.5, y: screenHeight * 0.12 }
            ];

            const activeCenters = epicenters.filter(() => Math.random() > 0.45);
            if (activeCenters.length === 0) activeCenters.push(epicenters[0]);

            activeCenters.forEach(center => {
                const count = 3 + Math.floor(Math.random() * 4);
                
                for (let i = 0; i < count; i++) {
                    const heart = document.createElement('div');
                    const sizeClass = Math.random() > 0.7 ? 'text-2xl sm:text-4xl' : 'text-lg sm:text-2xl';
                    heart.className = `burst-heart ${sizeClass}`;
                    heart.innerHTML = heartTypes[Math.floor(Math.random() * heartTypes.length)];
                    
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 120 + Math.random() * 500; 
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;
                    const rotation = Math.floor(Math.random() * 180) - 90;

                    heart.style.left = `${center.x}px`;
                    heart.style.top = `${center.y}px`;
                    heart.style.setProperty('--tx', `${tx}px`);
                    heart.style.setProperty('--ty', `${ty}px`);
                    heart.style.setProperty('--rot', `${rotation}deg`);

                    container.appendChild(heart);
                    setTimeout(() => heart.remove(), 3200);
                }
            });
        }

        function switchMode(mode) {
            activeMode = mode;
            const btnSetup = document.getElementById('btn-setup-mode');
            const btnActivity = document.getElementById('btn-activity-mode');
            const setupPanel = document.getElementById('setup-panel');
            const timerPanel = document.getElementById('timer-panel');

            if (mode === 'setup') {
                btnSetup.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm lg:text-base font-bold transition-all bg-yellow-400 text-white shadow-sm";
                btnActivity.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm lg:text-base font-bold transition-all text-yellow-700 hover:bg-yellow-200";
                setupPanel.classList.remove('hidden'); timerPanel.classList.add('hidden');
                pauseTimer();
            } else {
                btnActivity.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm lg:text-base font-bold transition-all bg-blue-500 text-white shadow-sm";
                btnSetup.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm lg:text-base font-bold transition-all text-yellow-700 hover:bg-yellow-200";
                setupPanel.classList.add('hidden'); timerPanel.classList.remove('hidden');
                updateTimerFromInputs();
            }
            renderKidsGrid();
        }

        function startActivityFromSetup() {
            updateTimerFromInputs();
            switchMode('activity');
            startTimer();
        }

        function toggleTimer() { if (isTimerRunning) pauseTimer(); else startTimer(); }

        function startTimer() {
            initAudio();
            if (isTimerRunning) return;
            if (timerRemaining <= 0) timerRemaining = timerDuration;
            isTimerRunning = true;
            document.getElementById('text-timer-play').textContent = '일시정지';
            document.getElementById('icon-timer-play').className = 'fa-solid fa-pause';
            document.getElementById('timer-status-badge').textContent = '활동 중입니다! 🏃‍♂️💨';
            document.getElementById('timer-status-badge').className = 'text-[10px] font-bold text-emerald-600 bg-emerald-100 border border-emerald-200 px-2 py-0.5 rounded-full text-center animate-pulse';

            startBgmSystem();

            timerInterval = setInterval(() => {
                if (timerRemaining > 0) { timerRemaining--; updateDisplay(); }
                else { handleTimerEnd(); }
            }, 1000);
        }

        function pauseTimer() {
            if (!isTimerRunning) return;
            isTimerRunning = false;
            clearInterval(timerInterval);
            
            stopBgmSystem();

            document.getElementById('text-timer-play').textContent = '계속';
            document.getElementById('icon-timer-play').className = 'fa-solid fa-play';
            document.getElementById('timer-status-badge').textContent = '잠시 멈춤 🛑';
            document.getElementById('timer-status-badge').className = 'text-[10px] font-bold text-amber-600 bg-amber-100 border border-amber-200 px-2 py-0.5 rounded-full text-center';
        }

        function resetTimer() {
            pauseTimer(); 
            timerRemaining = timerDuration; 
            updateDisplay();
            document.getElementById('text-timer-play').textContent = '시작';
            document.getElementById('icon-timer-play').className = 'fa-solid fa-play';
            document.getElementById('timer-status-badge').textContent = '대기 중.. ⏱️';
            document.getElementById('timer-status-badge').className = 'text-[10px] font-bold text-blue-600 bg-blue-100 border border-blue-200 px-2 py-0.5 rounded-full text-center';
        }

        function resetAllCompletions() {
            if (burstIntervalId) {
                clearInterval(burstIntervalId);
                burstIntervalId = null;
            }
            stopBgmSystem();
            kidsData.forEach(k => k.completed = false);
            renderKidsGrid(); updateDisplay(); playPopSound();
        }

        function handleTimerEnd() {
            pauseTimer(); 
            stopBgmSystem(); 
            playDingDongSound();
            document.getElementById('timer-status-badge').textContent = '🔔 우와! 활동 시간이 끝났어요! 🔔';
            document.getElementById('timer-status-badge').className = 'text-xs font-black text-rose-600 bg-rose-100 border border-rose-300 px-3 py-1 rounded-full text-center animate-bounce';
        }

        window.quickSetTime = quickSetTime;
        window.toggleTimer = toggleTimer;
        window.resetTimer = resetTimer;
        window.resetAllCompletions = resetAllCompletions;
        window.switchMode = switchMode;
        window.startActivityFromSetup = startActivityFromSetup;
        window.toggleBgmSetting = toggleBgmSetting;

        window.onload = function() {
            initFixedData();
            updateTimerFromInputs();
            renderKidsGrid();
        };
    </script>
</body>
</html>
