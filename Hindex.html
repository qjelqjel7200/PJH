    <script>
        const STORAGE_KEY = 'kinder_timer_21_data_v1';

        // Animals Database
        const ANIMALS_DATABASE = [
            { id: 'chick', emoji: '🐥', name: '병아리', color: 'bg-yellow-100 border-yellow-300 text-yellow-600 hover:bg-yellow-200' },
            { id: 'tiger', emoji: '🐯', name: '호랑이', color: 'bg-orange-100 border-orange-300 text-orange-600 hover:bg-orange-200' },
            { id: 'rabbit', emoji: '🐰', name: '토끼', color: 'bg-pink-100 border-pink-300 text-pink-500 hover:bg-pink-200' },
            { id: 'cat', emoji: '🐱', name: '고양이', color: 'bg-orange-50 border-orange-200 text-amber-600 hover:bg-orange-100' },
            { id: 'mouse', emoji: '🐭', name: '생쥐', color: 'bg-zinc-100 border-zinc-200 text-zinc-500 hover:bg-zinc-200' },
            { id: 'fox', emoji: '🦊', name: '여우', color: 'bg-red-50 border-red-200 text-red-500 hover:bg-red-100' },
            { id: 'dog', emoji: '🐶', name: '강아지', color: 'bg-stone-100 border-stone-300 text-stone-600 hover:bg-stone-200' },
            { id: 'lion', emoji: '🦁', name: '사자', color: 'bg-amber-100 border-amber-300 text-amber-600 hover:bg-amber-200' },
            { id: 'elephant', emoji: '🐘', name: '코끼리', color: 'bg-cyan-100 border-cyan-300 text-cyan-600 hover:bg-cyan-200' },
            { id: 'frog', emoji: '🐸', name: '개구리', color: 'bg-emerald-100 border-emerald-300 text-emerald-600 hover:bg-emerald-200' },
            { id: 'unicorn', emoji: '🦄', name: '유니콘', color: 'bg-purple-100 border-purple-300 text-purple-600 hover:bg-purple-200' },
            { id: 'hamster', emoji: '🐹', name: '햄스터', color: 'bg-orange-100/70 border-amber-200 text-amber-700 hover:bg-orange-100' },
            { id: 'bear', emoji: '🐻', name: '곰', color: 'bg-amber-200/60 border-amber-400 text-amber-800 hover:bg-amber-200' },
            { id: 'panda', emoji: '🐼', name: '판다', color: 'bg-slate-100 border-slate-300 text-slate-700 hover:bg-slate-200' },
            { id: 'koala', emoji: '🐨', name: '코알라', color: 'bg-gray-100 border-gray-300 text-gray-700 hover:bg-gray-200' }
        ];

        let className = 'ㅇㅇ반';
        let kidsData = [];
        let activeMode = 'setup'; 
        let timerDuration = 600; 
        let timerRemaining = 600;
        let timerInterval = null;
        let isTimerRunning = false;

        function saveStateToLocalStorage() {
            try {
                const payload = {)
                    className: className,
                    kidsData: kidsData.map(k => ({
                        id: k.id,
                        name: k.name,
                        animalId: k.animal.id,
                        completed: k.completed
                    }))
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            } catch (e) {
                console.warn('LocalStorage save failed:', e);
            }
        }

        function loadStateFromLocalStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed.className !== undefined) className = parsed.className;
                    if (Array.isArray(parsed.kidsData) && parsed.kidsData.length === 21) {
                        kidsData = parsed.kidsData.map((item, idx) => {
                            const foundAnimal = ANIMALS_DATABASE.find(a => a.id === item.animalId) || ANIMALS_DATABASE[idx % ANIMALS_DATABASE.length];
                            return {
                                id: idx,
                                name: item.name || '',
                                animal: foundAnimal,
                                completed: !!item.completed
                            };
                        });
                        return true;
                    }
                }
            } catch (e) {
                console.warn('LocalStorage load failed:', e);
            }
            return false;
        }

        function initData() {
            const loaded = loadStateFromLocalStorage();
            if (!loaded) {
                kidsData = Array.from({ length: 21 }, (_, idx) => ({
                    id: idx,
                    name: '',
                    animal: ANIMALS_DATABASE[idx % ANIMALS_DATABASE.length],
                    completed: false
                }));
            }
            updateClassTitleDisplay();
        }

        function updateClassTitleDisplay() {
            const title = className.trim() !== '' ? className : 'ㅇㅇ반';
            document.getElementById('class-title-display').textContent = `신나는 ${title} 타이머`;
            document.getElementById('footer-class-name').textContent = title;
        }

        function editClassTitle() {
            const newTitle = prompt('학급 이름을 입력해주세요 (예: ㅇㅇ반, 하늘반):', className);
            if (newTitle !== null) {
                className = newTitle.trim() || 'ㅇㅇ반';
                updateClassTitleDisplay();
                saveStateToLocalStorage();
            }
        }

        function changeAnimal(index) {
            const currentKid = kidsData[index];
            const currentAnimalIdx = ANIMALS_DATABASE.findIndex(a => a.id === currentKid.animal.id);
            const nextAnimalIdx = (currentAnimalIdx + 1) % ANIMALS_DATABASE.length;
            currentKid.animal = ANIMALS_DATABASE[nextAnimalIdx];
            renderKidsGrid();
            saveStateToLocalStorage();
        }

        function editSingleKidName(index, event) {
            if (event) event.stopPropagation();
            const currentName = kidsData[index].name;
            const newName = prompt(`${index + 1}번째 어린이의 이름을 입력하세요:`, currentName);
            if (newName !== null) {
                kidsData[index].name = newName.trim();
                renderKidsGrid();
                saveStateToLocalStorage();
            }
        }

        function openEditNamesModal() {
            document.getElementById('modal-class-title-input').value = className;
            const grid = document.getElementById('modal-kids-inputs-grid');
            grid.innerHTML = '';
            
            kidsData.forEach((kid, idx) => {
                const item = document.createElement('div');
                item.className = 'flex items-center gap-1 bg-slate-50 p-1 rounded-xl border border-slate-200';
                
                let selectOptions = ANIMALS_DATABASE.map(a => 
                    `<option value="${a.id}" ${a.id === kid.animal.id ? 'selected' : ''}>${a.emoji} ${a.name}</option>`
                ).join('');

                item.innerHTML = `
                    <span class="text-[11px] font-bold text-slate-400 w-5">${idx + 1}.</span>
                    <select id="modal-animal-select-${idx}" class="text-xs bg-white border border-slate-300 rounded-lg p-1 text-slate-700">
                        ${selectOptions}
                    </select>
                    <input type="text" id="modal-kid-input-${idx}" value="${kid.name}" placeholder="이름 입력" class="w-full bg-white border border-slate-300 rounded-lg px-1.5 py-1 text-xs font-bold text-slate-700 focus:outline-none focus:border-yellow-400">
                `;
                grid.appendChild(item);
            });

            document.getElementById('edit-names-modal').classList.remove('hidden');
        }

        function closeEditNamesModal() {
            document.getElementById('edit-names-modal').classList.add('hidden');
        }

        function saveBulkNamesFromModal() {
            const newClassTitle = document.getElementById('modal-class-title-input').value.trim();
            className = newClassTitle || 'ㅇㅇ반';
            updateClassTitleDisplay();

            kidsData.forEach((kid, idx) => {
                const input = document.getElementById(`modal-kid-input-${idx}`);
                const animalSelect = document.getElementById(`modal-animal-select-${idx}`);
                if (input) kid.name = input.value.trim();
                if (animalSelect) {
                    const selectedAnimal = ANIMALS_DATABASE.find(a => a.id === animalSelect.value);
                    if (selectedAnimal) kid.animal = selectedAnimal;
                }
            });

            renderKidsGrid();
            saveStateToLocalStorage();
            closeEditNamesModal();
        }

        function renderKidsGrid() {
            const rows = [
                document.getElementById('grid-row-1'),
                document.getElementById('grid-row-2'),
                document.getElementById('grid-row-3')
            ];
            if (!rows[0]) return;
            rows.forEach(r => r.innerHTML = '');

            kidsData.forEach((kid, idx) => {
                const card = document.createElement('div');
                card.id = `kid-card-${idx}`;
                const completedBg = kid.completed ? 'bg-gradient-to-br from-rose-50 to-amber-50 border-rose-400 scale-[0.98]' : 'bg-white border-slate-200';
                card.className = `character-card relative h-full flex flex-col items-center justify-between p-1 rounded-xl border-2 transition-all duration-200 overflow-hidden ${completedBg}`;
                
                card.onclick = (e) => handleCardClick(idx, e);

                const displayName = kid.name.trim() !== '' ? kid.name : `어린이 ${idx + 1}`;
                const nameColorClass = kid.name.trim() !== '' ? 'text-slate-900 bg-yellow-100 ring-1 ring-yellow-300 border-yellow-400' : 'text-slate-400 bg-slate-50 border-slate-200';

                card.innerHTML = `
                    <div onclick="handleAnimalClick(${idx}, event)" title="클릭하여 동물 바꾸기" class="relative w-9 h-9 sm:w-11 sm:h-11 md:w-14 md:h-14 lg:w-16 lg:h-16 flex items-center justify-center rounded-xl ${kid.animal.color} shadow-sm flex-shrink-0 cursor-pointer group">
                        <span class="text-xl sm:text-2xl md:text-3xl lg:text-4xl select-none transform transition group-hover:scale-110">${kid.animal.emoji}</span>
                        <div class="absolute -bottom-1 right-0 bg-yellow-400 text-yellow-900 text-[7px] font-bold px-0.5 rounded-full border border-white shadow-sm opacity-80 group-hover:opacity-100">
                            🔄
                        </div>
                        <div class="absolute -top-1 -right-1 bg-rose-500 text-white w-4 h-4 sm:w-5 sm:h-5 rounded-full flex items-center justify-center shadow-md border border-white transform transition-all duration-300 ${kid.completed ? 'scale-100 opacity-100' : 'scale-0 opacity-0'}">
                            <i class="fa-solid fa-heart text-[7px] sm:text-[9px]"></i>
                        </div>
                        <div class="absolute -bottom-1 -left-1 bg-emerald-500 text-white px-0.5 py-0.2 rounded text-[6px] sm:text-[8px] font-black border border-white transform transition-all duration-300 ${kid.completed ? 'scale-100 opacity-100' : 'scale-0 opacity-0'}">완료!</div>
                    </div>
                    <div class="w-full text-center mt-0.5 flex-shrink-0 relative">
                        <div class="text-[10px] sm:text-xs md:text-sm rounded-lg py-0.5 px-0.5 font-bold ${nameColorClass} truncate flex items-center justify-center gap-0.5">
                            <span class="truncate">${displayName}</span>
                            <button onclick="editSingleKidName(${idx}, event)" title="이름 수정" class="text-slate-400 hover:text-yellow-700 text-[8px] md:text-[10px] flex-shrink-0">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                        </div>
                    </div>
                `;
                
                if (idx < 7) rows[0].appendChild(card);
                else if (idx < 14) rows[1].appendChild(card);
                else rows[2].appendChild(card);
            });

            updateDisplay();
        }

        function handleAnimalClick(index, event) {
            event.stopPropagation();
            changeAnimal(index);
        }

        function handleCardClick(index, event) {
            if (activeMode === 'setup') return;

            const kid = kidsData[index];
            kid.completed = !kid.completed;

            renderKidsGrid();
            saveStateToLocalStorage();
        }

        function updateDisplay() {
            const completedCount = kidsData.filter(k => k.completed).length;
            const completedElem = document.getElementById('completed-count');
            if (completedElem) completedElem.textContent = completedCount;
        }

        function quickSetTime(min, sec) {
            document.getElementById('input-min').value = min;
            document.getElementById('input-sec').value = sec;
        }

        function updateTimerFromInputs() {
            const m = parseInt(document.getElementById('input-min').value) || 0;
            const s = parseInt(document.getElementById('input-sec').value) || 0;
            timerDuration = m * 60 + s;
            timerRemaining = timerDuration;
            formatDisplayTime();
        }

        function formatDisplayTime() {
            const m = Math.floor(timerRemaining / 60);
            const s = timerRemaining % 60;
            const formatted = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            document.getElementById('display-time').textContent = formatted;
        }

        function switchMode(mode) {
            activeMode = mode;
            const btnSetup = document.getElementById('btn-setup-mode');
            const btnActivity = document.getElementById('btn-activity-mode');
            const setupPanel = document.getElementById('setup-panel');
            const timerPanel = document.getElementById('timer-panel');

            if (mode === 'setup') {
                btnSetup.className = "px-3 py-1 rounded-lg text-xs md:text-sm font-bold transition-all bg-yellow-400 text-white shadow-sm";
                btnActivity.className = "px-3 py-1 rounded-lg text-xs md:text-sm font-bold transition-all text-yellow-700 hover:bg-yellow-200";
                setupPanel.classList.remove('hidden'); timerPanel.classList.add('hidden');
            } else {
                btnActivity.className = "px-3 py-1 rounded-lg text-xs md:text-sm font-bold transition-all bg-blue-500 text-white shadow-sm";
                btnSetup.className = "px-3 py-1 rounded-lg text-xs md:text-sm font-bold transition-all text-yellow-700 hover:bg-yellow-200";
                setupPanel.classList.add('hidden'); timerPanel.classList.remove('hidden');
                updateTimerFromInputs();
            }
            renderKidsGrid();
        }

        function startActivityFromSetup() {
            updateTimerFromInputs();
            switchMode('activity');
        }

        function toggleTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                document.getElementById('text-timer-play').textContent = '시작';
                document.getElementById('icon-timer-play').className = 'fa-solid fa-play';
            } else {
                isTimerRunning = true;
                document.getElementById('text-timer-play').textContent = '일시정지';
                document.getElementById('icon-timer-play').className = 'fa-solid fa-pause';
                timerInterval = setInterval(() => {
                    if (timerRemaining > 0) {
                        timerRemaining--;
                        formatDisplayTime();
                    } else {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            if (timerInterval) clearInterval(timerInterval);
            isTimerRunning = false;
            updateTimerFromInputs();
            document.getElementById('text-timer-play').textContent = '시작';
            document.getElementById('icon-timer-play').className = 'fa-solid fa-play';
        }

        function resetAllCompletions() {
            kidsData.forEach(k => k.completed = false);
            renderKidsGrid();
            saveStateToLocalStorage();
        }

        window.onload = function() {
            initData();
            updateTimerFromInputs();
            renderKidsGrid();
        };
    </script>
</body>
</html>
